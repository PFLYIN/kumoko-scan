# Servidor interno do SPA (atras do gateway). Nao publica portas no host.
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Healthcheck do container
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Assets com hash no nome: cache imutavel
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # index.html nunca deve ser cacheado (aponta para os assets da versao atual)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fallback do SPA: rotas do React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
