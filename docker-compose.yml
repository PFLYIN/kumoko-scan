version: '3.8'

services:
  # 🗄️ Banco de Dados Relacional (MariaDB)
  database:
    image: mariadb:10.6
    container_name: kumoko_db
    restart: always
    ports:
      - "3306:3306"
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./backup_banco.sql:/docker-entrypoint-initdb.d/backup_banco.sql
    networks:
      - kumoko_network

  # 🚀 Sistema de Cache (Redis)
  redis:
    image: redis:7-alpine
    container_name: kumoko_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kumoko_network

networks:
  kumoko_network:
    driver: bridge

volumes:
  mariadb_data:
  redis_data: