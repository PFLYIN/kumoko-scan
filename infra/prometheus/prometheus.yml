# Prometheus do Kumoko Scan: coleta /metrics dos servicos Nest pela rede interna kumoko_net.
# Nao e publicado no host nem no gateway; o Grafana consulta http://prometheus:9090.
global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 15s
  external_labels:
    stack: kumoko-scan

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: kumoko-services
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-service:3001"]
        labels:
          app: auth-service
      - targets: ["catalog-service:3002"]
        labels:
          app: catalog-service
      - targets: ["order-service:3003"]
        labels:
          app: order-service

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
