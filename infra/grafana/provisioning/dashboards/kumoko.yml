# Carrega os dashboards JSON de /var/lib/grafana/dashboards (infra/grafana/dashboards).
apiVersion: 1
providers:
  - name: kumoko
    folder: Kumoko Scan
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
