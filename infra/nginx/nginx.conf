user nginx;
worker_processes auto;
worker_rlimit_nofile 8192;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;
    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 30s;

    # Correlacao: reaproveita o X-Request-Id do cliente se for seguro, senao gera um novo.
    map $http_x_request_id $req_id {
        "~^[A-Za-z0-9._-]{8,64}$" $http_x_request_id;
        default $request_id;
    }

    # Caminho seguro para ecoar em respostas JSON geradas pelo proprio gateway.
    map $uri $safe_uri {
        "~^[A-Za-z0-9/._~-]{1,256}$" $uri;
        default "/";
    }

    # Healthcheck do gateway nao polui o access log.
    map $request_uri $loggable {
        /nginx-health 0;
        default 1;
    }

    # Access log estruturado (JSON) para correlacionar com os logs pino dos servicos.
    log_format json_access escape=json
        '{'
            '"time":"$time_iso8601",'
            '"service":"gateway",'
            '"request_id":"$req_id",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"protocol":"$server_protocol",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_addr":"$upstream_addr",'
            '"upstream_status":"$upstream_status",'
            '"upstream_response_time":"$upstream_response_time",'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log json_access if=$loggable;

    # Compressao de respostas textuais.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Rate limiting por IP: autenticacao (anti forca bruta) e API em geral.
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    # DNS interno do Docker: permite re-resolver containers recriados sem reiniciar o gateway.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    upstream auth_service {
        zone auth_service 64k;
        server auth-service:3001 resolve;
        keepalive 16;
    }

    upstream catalog_service {
        zone catalog_service 64k;
        server catalog-service:3002 resolve;
        keepalive 16;
    }

    upstream order_service {
        zone order_service 64k;
        server order-service:3003 resolve;
        keepalive 16;
    }

    upstream frontend {
        zone frontend 64k;
        server frontend:80 resolve;
        keepalive 8;
    }

    include /etc/nginx/conf.d/*.conf;
}
