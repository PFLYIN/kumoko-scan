# Parametros comuns de proxy para os upstreams (servicos Nest e frontend).
# Incluido dentro de cada location; o path NAO e reescrito (servicos ja usam /api).
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Request-Id $req_id;

proxy_connect_timeout 3s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;

# Nova tentativa so para falhas de conexao/502/503. O nginx nunca repete
# metodos nao idempotentes (POST, PATCH) sem "non_idempotent".
proxy_next_upstream error timeout http_502 http_503;
proxy_next_upstream_tries 2;
proxy_next_upstream_timeout 10s;

# O gateway e a fonte unica dos cabecalhos de seguranca e do X-Request-Id.
proxy_hide_header X-Powered-By;
proxy_hide_header X-Request-Id;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Content-Security-Policy;
