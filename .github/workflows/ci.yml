name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  web-build:
    name: Build web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Kumoko_Scan-Front/Kumoko_Scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Kumoko_Scan-Front/Kumoko_Scan/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: Kumoko_Scan-Front/Kumoko_Scan/dist
          if-no-files-found: error

  api-test:
    name: Test API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Kumoko_Scan-Back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Kumoko_Scan-Back/package-lock.json
      - run: npm ci
      - run: npm test
