server {
    listen 80;
    server_name kumokoscan.local localhost;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name kumokoscan.local localhost;

    client_max_body_size 50M;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;


    add_header X-Frame-Options "DENY" always;
    
    add_header X-Content-Type-Options "nosniff" always;
    
    add_header X-XSS-Protection "1; mode=block" always;
    
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

   add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://kumokoscan.local http://kumokoscan.local localhost; font-src 'self' data: https://cdnjs.cloudflare.com; connect-src 'self' ws: wss: https://kumokoscan.local http://kumokoscan.local;" always;

    location / {
        proxy_pass http://kumoko_frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/ {
        proxy_pass http://kumoko_backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /files/ {
        proxy_pass http://kumoko_backend:3000/files/;
        proxy_set_header Host $host;
        client_max_body_size 50M;
    }
    
    location /api-docs {
        proxy_pass http://kumoko_backend:3000/api-docs;
        proxy_set_header Host $host;
    }
}